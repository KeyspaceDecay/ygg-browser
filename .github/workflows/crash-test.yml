name: Crash reproduce (Android emulator)

on:
  workflow_dispatch:

jobs:
  emulator-crash-test:
    name: Launch APK on API 35 emulator, capture crash log
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Download yggstack binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          curl -fSL --retry 3 -o app/src/main/jniLibs/x86_64/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-amd64
          chmod +x app/src/main/jniLibs/*/libyggstack.so

      - name: Build debug APK
        run: ./gradlew :app:assembleLightningLiteDebug --stacktrace

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb install -r app/build/outputs/apk/lightningLite/debug/*lite*debug*.apk
            adb shell pm list packages | grep lightning || true
            adb logcat -c
            adb shell monkey -p acr.browser.lightning -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "=== crash buffer ==="
            adb logcat -b crash -d
            echo "=== main errors ==="
            adb logcat -d *:E | grep -iE "lightning|ygg|FATAL|AndroidRuntime" | tail -100 || true
            echo "=== process alive? ==="
            adb shell pidof acr.browser.lightning || echo "PROCESS DEAD - CRASHED"
            mkdir -p /tmp/out
            adb logcat -d > /tmp/out/logcat-full.txt
            adb logcat -b crash -d > /tmp/out/logcat-crash.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash-logs
          path: |
            /tmp/out/logcat-full.txt
            /tmp/out/logcat-crash.txt
          if-no-files-found: warn
