name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  desktop:
    name: Desktop (lint, build, smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (changed areas)
        run: npx standard main/ygg.js js/preload/yggPreload.js pages/yggSettings/yggSettings.js

      - name: Build
        run: npm run build

      - name: Download yggstack
        run: ../scripts/get-yggstack.sh

      - name: Smoke test (yggstack sidecar + SOCKS proxy)
        run: |
          node scripts/smoke-test.js

      - name: Package (Linux, no publish)
        if: github.event_name == 'push'
        run: npm run buildAppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (assemble debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # the ubuntu-latest runner already ships the Android SDK with accepted licenses

      - name: Download yggstack binary (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          chmod +x app/src/main/jniLibs/arm64-v8a/libyggstack.so

      - name: Build debug APK (lite flavor)
        run: ./gradlew lightningLiteDebug assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-android-debug
          path: android/app/build/outputs/apk/**/lite/debug/*.apk
