name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  desktop:
    name: Desktop (lint, build, smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (changed areas)
        run: npx standard main/ygg.js js/preload/yggPreload.js pages/yggSettings/yggSettings.js

      - name: Build
        run: npm run build

      - name: Download yggstack
        run: ../scripts/get-yggstack.sh

      - name: Smoke test (yggstack sidecar + SOCKS proxy)
        run: |
          node scripts/smoke-test.js

      - name: Package (Linux, no publish)
        if: github.event_name == 'push'
        run: npm run buildAppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (Fenix fork debug)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch android-components
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Download yggstack binary (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          chmod +x app/src/main/jniLibs/arm64-v8a/libyggstack.so

      - uses: gradle/actions/setup-gradle@v6

      - name: Build forkDebug variant
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        run: ./gradlew app:assembleForkDebug -PversionName=0.0.0-ygg-ci --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-android-debug
          path: android/**/outputs/apk/forkDebug/*.apk
          if-no-files-found: error
