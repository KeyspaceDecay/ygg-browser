name: Vanilla build (upstream baseline)

on:
  workflow_dispatch:

jobs:
  vanilla:
    name: Build unmodified upstream Lightning (lite, debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream Lightning-Browser
        uses: actions/checkout@v4
        with:
          repository: anthonycr/Lightning-Browser
          ref: main
          path: vanilla

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build lite debug APK
        run: ./gradlew :app:assembleLightningLiteDebug --stacktrace
        working-directory: vanilla

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-lightning-lite-debug
          path: vanilla/app/build/outputs/apk/lightningLite/debug/*.apk
          if-no-files-found: error
