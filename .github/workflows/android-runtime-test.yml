name: Android runtime test (emulator)

on:
  workflow_dispatch:

jobs:
  emulator-run:
    name: Launch forkDebug APK on API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Set up glean venv
        run: ./automation/iceraven/setup_venv.sh

      - name: Download yggstack binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          curl -fSL --retry 3 -o app/src/main/jniLibs/x86_64/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-amd64
          chmod +x app/src/main/jniLibs/*/libyggstack.so

      - name: Enable x86_64 ABI for the emulator build
        run: |
          sed -i 's/include "arm64-v8a"/include "arm64-v8a", "x86_64"/' app/build.gradle

      - name: Build forkDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=3g -Xms1g -Xmx6g"
        run: ./gradlew app:assembleForkDebug -PversionName=0.0.0-test --stacktrace --no-daemon

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            UNIVERSAL=$(ls android/gradle/build/app/outputs/apk/forkDebug/*universal*.apk 2>/dev/null | head -1);
            [ -n "$UNIVERSAL" ] || UNIVERSAL=$(find android/gradle/build/app/outputs/apk/forkDebug -name "*.apk" | grep -v "x86" | head -1);
            echo "APK=$UNIVERSAL";
            adb install -r -t "$UNIVERSAL";
            adb shell pm list packages | grep forkmaintainers;
            adb logcat -c;
            adb shell monkey -p io.github.forkmaintainers.ygg.debug -c android.intent.category.LAUNCHER 1;
            sleep 45;
            echo "=== crash buffer ===";
            adb logcat -b crash -d;
            echo "=== FATAL/Gecko ===";
            adb logcat -d | grep -iE "FATAL|SIGSEGV|SIGABRT|AndroidRuntime|libxul|Gecko|mozalloc|ygg" | tail -200;
            echo "=== process alive? ===";
            adb shell pidof io.github.forkmaintainers.ygg.debug || echo "PROCESS DEAD - CRASHED";
            mkdir -p /tmp/out;
            adb logcat -d > /tmp/out/logcat-full.txt;
            adb logcat -b crash -d > /tmp/out/logcat-crash.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-runtime-logs
          path: |
            /tmp/out/logcat-full.txt
            /tmp/out/logcat-crash.txt
          if-no-files-found: warn
