name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download yggstack
        shell: bash
        run: ../scripts/get-yggstack.sh

      - name: Build Windows packages
        run: npm run buildWindows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-windows
          path: |
            desktop/dist/app/*.exe
            desktop/dist/app/*.zip

  desktop-linux:
    name: Linux packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download yggstack
        run: ../scripts/get-yggstack.sh

      - name: Build deb
        run: npm run buildDebian
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        run: npm run buildAppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-linux
          path: |
            desktop/dist/app/*.deb
            desktop/dist/app/*.AppImage

  android:
    name: Android APK (Fenix/Gecko)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Set up glean venv
        run: ./automation/iceraven/setup_venv.sh
        # (iceraven android-components patches are already committed)

      - name: Download yggstack binary (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          chmod +x app/src/main/jniLibs/arm64-v8a/libyggstack.so

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/ygg-release.keystore

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed forkRelease APK
        env:
          KEYSTORE_FILE: /tmp/ygg-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        run: ./gradlew app:assembleForkRelease -PversionName=${GITHUB_REF_NAME#v} --stacktrace --no-daemon

      - name: Stage APK
        run: |
          APK=$(find . -path "*outputs/apk/forkRelease/*.apk" -name "*arm64*" | head -1)
          [ -n "$APK" ] || APK=$(find . -path "*outputs/apk/forkRelease/*.apk" | head -1)
          cp "$APK" "../Ygg-Browser-v${GITHUB_REF_NAME#v}-android-arm64.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-android
          path: "Ygg-Browser-v*-android-arm64.apk"
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [desktop-windows, desktop-linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract-release-notes.py "${GITHUB_REF_NAME#v}" CHANGELOG.md release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*
