name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download yggstack
        shell: bash
        run: ../scripts/get-yggstack.sh

      - name: Build Windows packages
        run: npm run buildWindows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-windows
          path: |
            desktop/dist/app/*.exe
            desktop/dist/app/*.zip

  desktop-linux:
    name: Linux packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download yggstack
        run: ../scripts/get-yggstack.sh

      - name: Build deb
        run: npm run buildDebian
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        run: npm run buildAppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-linux
          path: |
            desktop/dist/app/*.deb
            desktop/dist/app/*.AppImage

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # the ubuntu-latest runner already ships the Android SDK with accepted licenses

      - name: Download yggstack binary (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libyggstack.so \
            https://github.com/yggdrasil-network/yggstack/releases/download/1.0.6/yggstack-android-arm64
          chmod +x app/src/main/jniLibs/arm64-v8a/libyggstack.so

      - name: Build APK
        run: ./gradlew :app:assembleLightningLiteDebug --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygg-browser-android
          path: android/app/build/outputs/apk/lightningLite/debug/*.apk

  github-release:
    name: Create GitHub release
    needs: [desktop-windows, desktop-linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract-release-notes.py "${GITHUB_REF_NAME#v}" CHANGELOG.md release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*
